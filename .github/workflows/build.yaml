name: README build

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [update-profile]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      USER_NAME: ${{ secrets.USER_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest changes
        run: |
          git pull --ff-only origin main

      - name: Get Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt

      - name: Update README file
        run: python today.py

      - name: Commit and push changes
        run: |
          git config --global user.email "erenjb123@gmail.com"
          git config --global user.name "xtron62/GitHub-Actions-Bot"

          git add dark_mode.svg light_mode.svg cache/*.txt

          git commit -m "Updated README" || echo "No changes to commit"

          git push https://x-access-token:${ACCESS_TOKEN}@github.com/${USER_NAME}/${USER_NAME}.git main
